<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Food Donation Testimonials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-6 flex items-center justify-between">
            <div>
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-orange-600">Diwali Food Seva</p>
                <h1 class="text-2xl font-extrabold text-slate-900">Previous Year Food Donation Testimonials</h1>
            </div>
            <a href="../index.html" class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-5 py-2.5 rounded-xl transition">Back to Home</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center max-w-3xl mx-auto mb-10">
            <h2 class="text-3xl font-bold text-slate-900">Community moments from past drives</h2>
            <p class="mt-3 text-slate-600">These images capture the spirit of seva, volunteer effort, and the joy of helping families in need through our annual food donation campaigns.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <figure class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <img src="../testmonials/hindu%20food%20bank%202025.jpg" alt="Food donation volunteers and donors" class="block w-full h-auto max-h-[32rem] object-contain bg-slate-100">
                <figcaption class="p-5">
                    <span class="inline-block bg-orange-100 text-orange-700 text-xs font-bold px-2.5 py-1 rounded-full mb-3">2025</span>
                    <p class="text-slate-700 leading-relaxed">A successful community effort helping stock the Hindu Food Bank shelves with essential non-perishable goods.</p>
                </figcaption>
            </figure>

            <figure class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <img src="../testmonials/PHOTO-2023-11-23-11-49-23.jpg" alt="Food drive volunteers sorting donations" class="block w-full h-auto max-h-[32rem] object-contain bg-slate-100">
                <figcaption class="p-5">
                    <span class="inline-block bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full mb-3">Previous Years</span>
                    <p class="text-slate-700 leading-relaxed">Volunteers sorting and preparing donated items to support families across the community with care and compassion.</p>
                </figcaption>
            </figure>

            <figure class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <img src="../testmonials/PHOTO-2023-11-23-11-48-54.jpg" alt="Community members supporting the donation drive" class="block w-full h-auto max-h-[32rem] object-contain bg-slate-100">
                <figcaption class="p-5">
                    <span class="inline-block bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-full mb-3">Community Spirit</span>
                    <p class="text-slate-700 leading-relaxed">Families and volunteers coming together to make the food drive a meaningful and joyful act of service.</p>
                </figcaption>
            </figure>

            <figure class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <img src="../testmonials/hss%20diwali%20donation-hindu%20food%20bank.jpg" alt="HSS Diwali donation drive with Hindu Food Bank" class="block w-full h-auto max-h-[32rem] object-contain bg-slate-100">
                <figcaption class="p-5">
                    <span class="inline-block bg-violet-100 text-violet-700 text-xs font-bold px-2.5 py-1 rounded-full mb-3">Annual Drive</span>
                    <p class="text-slate-700 leading-relaxed">A tradition of generosity and seva that brings together the community around a shared mission of compassion.</p>
                </figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
